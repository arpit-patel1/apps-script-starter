<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Homework Playground</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('kp-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (ignore) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              display: ['Fraunces', 'Georgia', 'serif'],
              sans: ['"Source Sans 3"', 'ui-sans-serif', 'sans-serif'],
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              success: {
                DEFAULT: 'hsl(var(--success))',
                foreground: 'hsl(var(--success-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
              sidebar: {
                DEFAULT: 'hsl(var(--sidebar))',
                foreground: 'hsl(var(--sidebar-foreground))',
                border: 'hsl(var(--sidebar-border))',
                accent: 'hsl(var(--sidebar-accent))',
                'accent-foreground': 'hsl(var(--sidebar-accent-foreground))',
              },
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
            keyframes: {
              'fade-up': {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'pop-in': {
                '0%': { opacity: '0', transform: 'scale(0.97)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' },
              },
            },
            animation: {
              'fade-up': 'fade-up 0.4s ease-out both',
              'pop-in': 'pop-in 0.25s ease-out both',
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      :root {
        --background: 48 33% 97%;
        --foreground: 160 30% 12%;
        --card: 0 0% 100%;
        --card-foreground: 160 30% 12%;
        --primary: 162 64% 28%;
        --primary-foreground: 48 40% 98%;
        --secondary: 44 55% 92%;
        --secondary-foreground: 160 25% 18%;
        --muted: 150 18% 93%;
        --muted-foreground: 160 10% 40%;
        --accent: 28 90% 55%;
        --accent-foreground: 24 60% 12%;
        --destructive: 4 72% 48%;
        --destructive-foreground: 0 0% 100%;
        --success: 152 55% 32%;
        --success-foreground: 0 0% 100%;
        --border: 150 16% 84%;
        --input: 150 16% 84%;
        --ring: 162 64% 28%;
        --radius: 0.75rem;
        --sidebar: 160 28% 14%;
        --sidebar-foreground: 48 30% 96%;
        --sidebar-border: 160 20% 22%;
        --sidebar-accent: 162 40% 22%;
        --sidebar-accent-foreground: 48 40% 98%;
        --skeleton-mid: 0 0% 100% / 0.7;
        --page-wash:
          radial-gradient(ellipse 70% 45% at 90% -10%, hsl(44 80% 80% / 0.35), transparent),
          radial-gradient(ellipse 50% 35% at 100% 40%, hsl(162 40% 78% / 0.2), transparent),
          linear-gradient(180deg, hsl(48 33% 97%), hsl(150 20% 94%));
      }

      .dark {
        --background: 160 22% 8%;
        --foreground: 48 22% 96%;
        --card: 160 20% 12%;
        --card-foreground: 48 22% 96%;
        --primary: 162 52% 42%;
        --primary-foreground: 160 30% 8%;
        --secondary: 160 16% 16%;
        --secondary-foreground: 48 20% 92%;
        --muted: 160 14% 16%;
        --muted-foreground: 150 10% 68%;
        --accent: 28 88% 58%;
        --accent-foreground: 24 40% 10%;
        --destructive: 4 70% 56%;
        --destructive-foreground: 0 0% 100%;
        --success: 152 48% 42%;
        --success-foreground: 0 0% 100%;
        --border: 160 14% 22%;
        --input: 160 14% 22%;
        --ring: 162 52% 42%;
        --sidebar: 160 28% 7%;
        --sidebar-foreground: 48 28% 96%;
        --sidebar-border: 160 18% 16%;
        --sidebar-accent: 162 36% 18%;
        --sidebar-accent-foreground: 48 40% 98%;
        --skeleton-mid: 0 0% 100% / 0.08;
        --page-wash:
          radial-gradient(ellipse 70% 45% at 90% -10%, hsl(44 40% 28% / 0.18), transparent),
          radial-gradient(ellipse 50% 35% at 100% 40%, hsl(162 35% 24% / 0.22), transparent),
          linear-gradient(180deg, hsl(160 22% 8%), hsl(160 20% 10%));
      }

      body {
        background-color: hsl(var(--background));
        background-image: var(--page-wash);
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          hsl(var(--muted)) 25%,
          hsl(var(--skeleton-mid)) 50%,
          hsl(var(--muted)) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }

      .nav-link.active {
        background: hsl(var(--sidebar-accent));
        color: hsl(var(--sidebar-accent-foreground));
      }

      .nav-sublink.active {
        background: hsl(162 45% 28%);
        color: hsl(48 40% 98%);
      }

      .algorithm-board {
        width: fit-content;
        margin-inline: auto;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace;
      }

      .algorithm-board .alg-row {
        display: grid;
        grid-template-columns: 1.5rem minmax(4.5rem, auto);
        column-gap: 0.35rem;
        align-items: baseline;
        font-size: clamp(1.75rem, 5vw, 2.35rem);
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
      }

      .algorithm-board .alg-op {
        text-align: left;
        color: hsl(var(--primary));
      }

      .algorithm-board .alg-num {
        text-align: right;
      }

      .algorithm-board .alg-rule {
        margin-top: 0.35rem;
        margin-bottom: 0.15rem;
        border-top: 3px solid hsl(var(--foreground));
        grid-column: 1 / -1;
      }

      .long-division-board {
        width: fit-content;
        margin-inline: auto;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace;
      }

      .long-division-board .ld-row {
        display: flex;
        align-items: stretch;
        gap: 0.35rem;
        font-size: clamp(1.6rem, 4.5vw, 2.2rem);
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .long-division-board .ld-divisor {
        display: flex;
        align-items: center;
        color: hsl(var(--primary));
      }

      .long-division-board .ld-box {
        border-left: 3px solid hsl(var(--foreground));
        border-top: 3px solid hsl(var(--foreground));
        padding: 0.15rem 0.55rem 0.35rem;
        min-width: 4.5rem;
        text-align: right;
      }
    </style>
  </head>
  <body class="min-h-screen font-sans text-foreground antialiased">
    <div id="login-screen" class="hidden min-h-screen px-4 py-10 sm:px-6">
      <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-md flex-col justify-center">
        <section class="animate-fade-up rounded-lg border border-border bg-card p-6 shadow-sm sm:p-8">
          <div class="mb-6 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-md bg-accent font-display text-sm font-bold text-accent-foreground">
              KP
            </div>
            <div>
              <p class="font-display text-2xl font-semibold tracking-tight">Kids Playground</p>
              <p class="text-sm text-muted-foreground">Sign in with your username</p>
            </div>
          </div>
          <form id="login-form" class="space-y-4">
            <div class="space-y-2">
              <label for="login-username" class="text-sm font-medium">Username</label>
              <input
                id="login-username"
                name="username"
                type="text"
                autocomplete="username"
                required
                class="flex h-12 w-full rounded-md border border-input bg-background px-3 py-2 text-base shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
              />
            </div>
            <div class="space-y-2">
              <label for="login-password" class="text-sm font-medium">Password</label>
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="flex h-12 w-full rounded-md border border-input bg-background px-3 py-2 text-base shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
              />
            </div>
            <p id="login-error" class="hidden text-sm font-medium text-destructive" role="alert"></p>
            <button
              id="login-submit"
              type="submit"
              class="inline-flex h-11 w-full items-center justify-center rounded-md bg-primary px-6 text-sm font-semibold text-primary-foreground shadow hover:opacity-90 disabled:opacity-50"
            >
              Sign in
            </button>
          </form>
        </section>
      </div>
    </div>

    <div id="app-shell" class="hidden min-h-screen">
      <div class="flex min-h-screen">
        <!-- Overlay (mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 z-40 hidden bg-foreground/40 backdrop-blur-sm md:hidden"></div>

        <!-- Sidebar -->
        <aside
          id="sidebar"
          class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-sidebar-border bg-sidebar text-sidebar-foreground transition-all duration-200 md:static md:translate-x-0"
        >
          <div class="flex items-center gap-3 border-b border-sidebar-border px-4 py-4">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-accent font-display text-sm font-bold text-accent-foreground">
              KP
            </div>
            <div class="min-w-0 flex-1">
              <p class="font-display text-lg font-semibold leading-none tracking-tight">Playground</p>
              <p class="mt-1 text-xs text-sidebar-foreground/65">Homework lab</p>
            </div>
            <button
              id="sidebar-collapse"
              type="button"
              class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-sidebar-foreground/80 transition hover:bg-sidebar-accent hover:text-sidebar-accent-foreground"
              aria-label="Collapse sidebar"
              title="Collapse sidebar"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 6 9 12l6 6" />
              </svg>
            </button>
          </div>

          <nav class="flex-1 overflow-y-auto px-3 py-4" id="side-nav" aria-label="Activities"></nav>
        </aside>

        <!-- Main -->
        <div class="flex min-w-0 flex-1 flex-col">
          <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-border bg-card/90 px-4 py-3 backdrop-blur sm:px-6">
            <button
              id="menu-btn"
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-input bg-background shadow-sm"
              aria-label="Toggle sidebar"
              title="Toggle sidebar"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <div class="min-w-0 flex-1">
              <p id="crumb" class="truncate text-sm text-muted-foreground">Home</p>
              <h1 id="page-title" class="font-display truncate text-xl font-semibold tracking-tight sm:text-2xl">Homepage</h1>
            </div>
            <p id="user-label" class="hidden max-w-[8rem] truncate text-sm font-medium text-muted-foreground sm:block"></p>
            <button
              id="logout-btn"
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-input bg-background shadow-sm transition hover:bg-muted"
              aria-label="Sign out"
              title="Sign out"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="m16 17 5-5-5-5" />
                <path d="M21 12H9" />
              </svg>
            </button>
            <button
              id="theme-toggle"
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-md border border-input bg-background shadow-sm transition hover:bg-muted"
              aria-label="Toggle color theme"
              title="Toggle color theme"
            >
              <span id="theme-icon" class="inline-flex h-5 w-5 items-center justify-center" aria-hidden="true"></span>
            </button>
          </header>

          <main id="app" class="flex-1 px-4 py-6 sm:px-6 lg:px-8"></main>
        </div>
      </div>
    </div>

    <script>

              {

              {

            ],
          },
          {

            type: 'group',
            open: false,
            children: [
              {
                id: 'geog-quiz',
                label: 'Capitals & continents',
                route: 'geography/quiz',
                ready: true,
              },
            ],
          },
        ];

        var THEME_ORDER = ['light', 'dark', 'system'];
        var THEME_ICONS = {
          light:
            '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
          dark:
            '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>',
          system:
            '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
        };
        var THEME_LABELS = { light: 'Light', dark: 'Dark', system: 'Auto' };

        var TOKEN_KEY = 'kp-auth-token';

        var state = {
          route: 'home',
          meta: null,
          problem: null,
          openGroups: { math: true, ela: false, geometry: false, geography: false },
          sidebarOpen: true,
          theme: 'system',
          token: null,
          user: null,
        };

        var els = {
          loginScreen: document.getElementById('login-screen'),
          appShell: document.getElementById('app-shell'),
          loginForm: document.getElementById('login-form'),
          loginUsername: document.getElementById('login-username'),
          loginPassword: document.getElementById('login-password'),
          loginError: document.getElementById('login-error'),
          loginSubmit: document.getElementById('login-submit'),
          sidebar: document.getElementById('sidebar'),
          overlay: document.getElementById('sidebar-overlay'),
          menuBtn: document.getElementById('menu-btn'),
          collapseBtn: document.getElementById('sidebar-collapse'),
          themeToggle: document.getElementById('theme-toggle'),
          themeIcon: document.getElementById('theme-icon'),
          logoutBtn: document.getElementById('logout-btn'),
          userLabel: document.getElementById('user-label'),
          sideNav: document.getElementById('side-nav'),
          app: document.getElementById('app'),
          crumb: document.getElementById('crumb'),
          pageTitle: document.getElementById('page-title'),
        };

        function readStoredToken() {
          try {
            return sessionStorage.getItem(TOKEN_KEY) || null;
          } catch (ignore) {
            return null;
          }
        }

        function writeStoredToken(token) {
          try {
            if (token) sessionStorage.setItem(TOKEN_KEY, token);
            else sessionStorage.removeItem(TOKEN_KEY);
          } catch (ignore) {}
        }

        function withToken(payload) {
          var next = payload ? Object.assign({}, payload) : {};
          next.token = state.token;
          return next;
        }

        function isAuthError(error) {
          var message = error && error.message ? String(error.message) : String(error || '');
          return /sign in|session expired/i.test(message);
        }

        function showLogin(message) {
          state.token = null;
          state.user = null;
          state.meta = null;
          writeStoredToken(null);
          if (els.appShell) els.appShell.classList.add('hidden');
          if (els.loginScreen) els.loginScreen.classList.remove('hidden');
          if (els.loginError) {
            if (message) {
              els.loginError.textContent = message;
              els.loginError.classList.remove('hidden');
            } else {
              els.loginError.textContent = '';
              els.loginError.classList.add('hidden');
            }
          }
          if (els.loginPassword) els.loginPassword.value = '';
          if (els.loginUsername) els.loginUsername.focus();
        }

        function showShell() {
          if (els.loginScreen) els.loginScreen.classList.add('hidden');
          if (els.appShell) els.appShell.classList.remove('hidden');
          if (els.userLabel) {
            els.userLabel.textContent = (state.user && state.user.displayName) || '';
            els.userLabel.classList.toggle('hidden', !state.user);
          }
        }

        function handleAuthFailure(error) {
          if (isAuthError(error)) {
            showLogin(error && error.message ? error.message : 'Please sign in to continue.');
            return true;
          }
          return false;
        }

        function isMobileNav() {
          return window.matchMedia('(max-width: 767px)').matches;
        }

        function readStoredTheme() {
          try {
            var stored = localStorage.getItem('kp-theme');
            if (THEME_ORDER.indexOf(stored) !== -1) return stored;
          } catch (ignore) {}
          return 'system';
        }

        function systemPrefersDark() {
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function applyTheme(pref) {
          state.theme = THEME_ORDER.indexOf(pref) !== -1 ? pref : 'system';
          var dark = state.theme === 'dark' || (state.theme === 'system' && systemPrefersDark());
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          try {
            localStorage.setItem('kp-theme', state.theme);
          } catch (ignore) {}
          if (els.themeIcon) els.themeIcon.innerHTML = THEME_ICONS[state.theme];
          if (els.themeToggle) {
            els.themeToggle.setAttribute(
              'aria-label',
              'Color theme: ' + THEME_LABELS[state.theme] + '. Click to change.',
            );
            els.themeToggle.title = 'Theme: ' + THEME_LABELS[state.theme];
          }
        }

        function cycleTheme() {
          var idx = THEME_ORDER.indexOf(state.theme);
          applyTheme(THEME_ORDER[(idx + 1) % THEME_ORDER.length]);
        }

        function applySidebarState() {
          if (state.sidebarOpen) {
            els.sidebar.classList.remove('-translate-x-full', 'md:hidden', 'pointer-events-none');
            els.sidebar.setAttribute('aria-hidden', 'false');
            if (isMobileNav()) {
              els.overlay.classList.remove('hidden');
            } else {
              els.overlay.classList.add('hidden');
            }
          } else {
            els.sidebar.classList.add('-translate-x-full');
            if (!isMobileNav()) {
              els.sidebar.classList.add('md:hidden');
            }
            els.overlay.classList.add('hidden');
            els.sidebar.setAttribute('aria-hidden', 'true');
          }
          try {
            localStorage.setItem('kp-sidebar-open', state.sidebarOpen ? '1' : '0');
          } catch (ignore) {}
        }

        function setSidebarOpen(open) {
          state.sidebarOpen = !!open;
          applySidebarState();

        function toggleSidebar() {
          setSidebarOpen(!state.sidebarOpen);

        function closeMobileNav() {
          if (isMobileNav()) setSidebarOpen(false);

        function findRouteMeta(route) {
          if (route === 'home') {
            return { crumb: 'Home', title: 'Homepage', subject: null, activity: null };
          }
          for (var i = 0; i < NAV.length; i++) {
            var item = NAV[i];
            if (item.type !== 'group') continue;
            for (var j = 0; j < item.children.length; j++) {
              var child = item.children[j];
              if (child.route === route) {
                return {
                  crumb: item.label + ' / ' + child.label,
                  title: child.label,
                  subject: item.id,
                  activity: child,
                };
              }
            }
          }
          return { crumb: 'Home', title: 'Homepage', subject: null, activity: null };
        }

        function navigate(route) {
          state.route = route || 'home';
          var info = findRouteMeta(state.route);
          if (info.subject) state.openGroups[info.subject] = true;
          els.crumb.textContent = info.crumb;
          els.pageTitle.textContent = info.title;
          renderNav();
          renderPage();
          if (isMobileNav()) setSidebarOpen(false);

        function renderNav() {

            }

            var open = !!state.openGroups[item.id];
            html +=
              '<div class="mb-2">' +
              '<button type="button" data-toggle="' +
              item.id +
              '" class="flex w-full items-center justify-between rounded-md px-3 py-2.5 text-left text-sm font-semibold transition hover:bg-sidebar-accent/60">' +
              '<span>' +

            if (open) {

              item.children.forEach(function (child) {

              html += '</div>';
            }
            html += '</div>';

          els.sideNav.innerHTML = html;

          els.sideNav.querySelectorAll('[data-route]').forEach(function (btn) {

              navigate(btn.getAttribute('data-route'));

          els.sideNav.querySelectorAll('[data-toggle]').forEach(function (btn) {

              var id = btn.getAttribute('data-toggle');

              renderNav();
            });
          });
        }

        function typeLabel(mode, type) {
          if (mode === 'multiplication') {
            if (type === '1_digit') return '1-digit multiplier';
            if (type === '2_digit') return '2-digit multiplier';
          }
          if (mode === 'division') {
            if (type === 'facts') return 'Facts';
            if (type === 'divide') return 'Divide';
            if (type === 'long_division') return 'Long division';
          }
          if (mode === 'place_value') {
            if (type === 'digit_value') return 'Digit value';
            if (type === 'standard') return 'Standard form';
            if (type === 'expanded') return 'Expanded form';
            if (type === 'word') return 'From words';
            if (type === 'compare') return 'Compare';
          }
          if (mode === 'rounding') {
            if (type === 'forward') return 'Round';
            if (type === 'reverse') return 'Which rounds?';
          }
          if (mode === 'factors') {
            if (type === 'pairs') return 'Factor pairs';
            if (type === 'multiples') return 'Multiples';
            if (type === 'list_multiples') return 'List multiples';
            if (type === 'prime_composite') return 'Prime or composite';
          }
          if (mode === 'times_as_many') {
            if (type === 'equation') return 'Equation';
            if (type === 'word') return 'Word problem';
            if (type === 'write_equation') return 'Write equation';
          }
          if (mode === 'money_count') {
            if (type === 'count') return 'Count coins & bills';
            if (type === 'make') return 'Make an amount';
          }
          if (mode === 'measurement') {
            if (type === 'length') return 'Length';
            if (type === 'volume') return 'Volume';
            if (type === 'weight') return 'Weight';
          }
          if (mode === 'time') {
            if (type === 'read') return 'Read the clock';
            if (type === 'elapsed') return 'Elapsed time';
            if (type === 'convert') return 'Convert units';
          }
          if (mode === 'fractions') {
            if (type === 'add') return 'Add';
            if (type === 'subtract') return 'Subtract';
            if (type === 'multiply') return 'Multiply';
            if (type === 'compare') return 'Compare';
          }
          if (mode === 'input_output') {
            if (type === 'fill') return 'Fill missing';
            if (type === 'find_rule') return 'Find the rule';
          }
          return String(type || '').replace(/_/g, ' ');
        }

        function answerHints(mode, type) {
          if (mode === 'factors') {
            if (type === 'pairs') {
              return { label: 'Factor pairs', placeholder: 'e.g. 1x12, 2x6, 3x4', inputMode: 'text' };
            }
            if (type === 'multiples') {
              return { label: 'Yes or no', placeholder: 'yes or no', inputMode: 'text' };
            }
            if (type === 'list_multiples') {
              return { label: 'Multiples', placeholder: 'e.g. 2, 4, 6, 8, 10', inputMode: 'text' };
            }
            if (type === 'prime_composite') {
              return {
                label: 'Prime, composite, or neither',
                placeholder: 'prime, composite, or neither',
                inputMode: 'text',
              };
            }
          }
          if (mode === 'rounding') {
            if (type === 'reverse') {
              return {
                label: 'A number that rounds',
                placeholder: 'Any number that rounds to the target',
                inputMode: 'numeric',
              };
            }
            return { label: 'Rounded number', placeholder: 'Rounded number', inputMode: 'numeric' };
          }
          if (mode === 'times_as_many') {
            if (type === 'write_equation') {
              return {
                label: 'Equation',
                placeholder: 'e.g. 24 = 3 × 8',
                inputMode: 'text',
              };
            }
            return { label: 'Your answer', placeholder: 'Type the number', inputMode: 'numeric' };
          }
          if (mode === 'place_value') {
            if (type === 'expanded') {
              return {
                label: 'Expanded form',

          if (mode === 'money_count') {
            if (type === 'make') {
              return {
                label: 'Number of coins',
                placeholder: 'Fewest coins total',
                inputMode: 'numeric',
              };
            }
            return {
              label: 'Amount',
              placeholder: 'e.g. $1.35 or 135¢',
              inputMode: 'decimal',
            };
          }
          if (mode === 'money_change') {
            return {
              label: 'Change',
              placeholder: 'e.g. $0.25 or 25¢',
              inputMode: 'decimal',
            };
          }
          if (mode === 'money_compare') {
            return { label: 'Compare', placeholder: '<, >, or =', inputMode: 'text' };
          }
          if (mode === 'measurement') {
            return { label: 'Converted amount', placeholder: 'Type the number', inputMode: 'numeric' };

          if (mode === 'time') {
            if (type === 'convert') {
              return {
                label: 'Your answer',

            }
            return {

              placeholder: 'e.g. 3/4 or 1 1/2',
              inputMode: 'text',
            };
          }
          if (mode === 'order_of_operations') {
            return { label: 'Value', placeholder: 'Type the result', inputMode: 'numeric' };
          }
          if (mode === 'input_output') {
            if (type === 'find_rule') {
              return {
                label: 'Rule',
                placeholder: 'e.g. + 5 or × 3',
                inputMode: 'text',
              };
            }
            return {
              label: 'Missing values',
              placeholder: 'e.g. 12, 8',
              inputMode: 'text',
            };

          if (mode === 'geography') {
            return {

        var PILL_BASE =
          'inline-flex h-9 items-center justify-center rounded-full border px-3.5 text-sm font-semibold transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:opacity-50';
        var PILL_IDLE = 'border-border bg-background text-foreground hover:bg-muted';
        var PILL_ACTIVE = 'border-primary bg-primary text-primary-foreground shadow-sm';

        function renderPills(container, items, selectedValue, onSelect, getValue, getLabel, getTitle) {
          if (!container) return;
          container.innerHTML = '';
          items.forEach(function (item) {
            var value = getValue(item);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = PILL_BASE + ' ' + (String(value) === String(selectedValue) ? PILL_ACTIVE : PILL_IDLE);
            btn.textContent = getLabel(item);
            if (getTitle) btn.title = getTitle(item);
            btn.setAttribute('aria-pressed', String(value) === String(selectedValue) ? 'true' : 'false');
            btn.addEventListener('click', function () {
              if (String(value) === String(selectedValue)) return;
              onSelect(value);
            });
            container.appendChild(btn);
          });
        }

        function wirePractice(mode) {
          var optionsToggle = document.getElementById('options-toggle');
          var optionsPanel = document.getElementById('options-panel');
          var optionsSummary = document.getElementById('options-summary');
          var optionsChevron = document.getElementById('options-chevron');
          var gradePills = document.getElementById('grade-pills');
          var difficultyPills = document.getElementById('difficulty-pills');
          var typePills = document.getElementById('type-pills');
          var promptEl = document.getElementById('prompt');
          var hintEl = document.getElementById('hint');
          var answerEl = document.getElementById('answer');
          var answerLabelEl = document.getElementById('answer-label');
          var checkBtn = document.getElementById('check');
          var nextBtn = document.getElementById('next');
          var feedbackEl = document.getElementById('feedback');
          var statusEl = document.getElementById('status');
          var metaLine = document.getElementById('meta-line');
          var answered = false;
          var selectedGrade = 3;
          var selectedDifficulty = 'medium';
          var selectedType = null;
          var typeOptions = [];
          var controlsBusy = false;
          var optionsOpen = true;

          try {
            if (localStorage.getItem('kp-options-open') === '0') optionsOpen = false;
          } catch (ignore) {}

          function applyAnswerHints(type) {
            var hints = answerHints(mode, type);
            if (!hints) return;
            if (answerLabelEl) answerLabelEl.textContent = hints.label;
            answerEl.placeholder = hints.placeholder;
            answerEl.setAttribute('inputmode', hints.inputMode);
          }

          function difficultyLabel(id) {
            if (id === 'easy') return 'Easy';
            if (id === 'hard') return 'Hard';
            return 'Medium';
          }

          function selectedTypeLabel() {
            if (!selectedType || !typeOptions.length) return '';
            for (var i = 0; i < typeOptions.length; i += 1) {
              if (String(typeOptions[i].id) === String(selectedType)) return typeOptions[i].label;
            }
            return typeLabel(mode, selectedType);
          }

          function updateOptionsSummary() {
            if (!optionsSummary) return;
            var parts = ['Grade ' + selectedGrade, difficultyLabel(selectedDifficulty)];
            var typeName = selectedTypeLabel();
            if (typeName) parts.push(typeName);
            optionsSummary.textContent = parts.join(' · ');
          }

          function applyOptionsOpen() {
            if (!optionsPanel || !optionsToggle) return;
            if (optionsOpen) {
              optionsPanel.classList.remove('hidden');
              optionsToggle.setAttribute('aria-expanded', 'true');
              if (optionsChevron) optionsChevron.querySelector('svg').style.transform = 'rotate(0deg)';
            } else {
              optionsPanel.classList.add('hidden');
              optionsToggle.setAttribute('aria-expanded', 'false');
              if (optionsChevron) optionsChevron.querySelector('svg').style.transform = 'rotate(-90deg)';
            }
            try {
              localStorage.setItem('kp-options-open', optionsOpen ? '1' : '0');
            } catch (ignore) {}
          }

          function refreshPills() {
            renderPills(
              gradePills,
              (state.meta && state.meta.grades) || [3, 4, 5],
              selectedGrade,
              function (value) {
                selectedGrade = Number(value);
                refreshPills();
                loadProblem();
              },
              function (g) { return g; },
              function (g) { return String(g); },
              function (g) { return 'Grade ' + g; },
            );
            renderPills(
              difficultyPills,
              (state.meta && state.meta.difficulties) || [
                { id: 'easy', label: 'E', full: 'Easy' },
                { id: 'medium', label: 'M', full: 'Medium' },
                { id: 'hard', label: 'H', full: 'Hard' },
              ],
              selectedDifficulty,
              function (value) {
                selectedDifficulty = value;
                refreshPills();
                loadProblem();
              },
              function (d) { return d.id; },
              function (d) { return d.label; },
              function (d) { return d.full || d.label; },
            );
            if (typePills) {
              renderPills(
                typePills,
                typeOptions,
                selectedType,
                function (value) {
                  selectedType = value;
                  applyAnswerHints(selectedType);
                  refreshPills();
                  loadProblem();
                },
                function (t) { return t.id; },
                function (t) { return t.label; },
              );
            }
            updateOptionsSummary();
            setBusy(controlsBusy);
          }

          function setBusy(busy) {
            controlsBusy = busy;
            [gradePills, difficultyPills, typePills].forEach(function (group) {
              if (!group) return;
              Array.prototype.forEach.call(group.querySelectorAll('button'), function (btn) {
                btn.disabled = busy;
              });
            });
            if (!answered) {
              answerEl.disabled = busy;
              checkBtn.disabled = busy;
            }
            if (answered) {
              nextBtn.disabled = busy;
            }
          }

          function showCheckMode() {
            answered = false;
            checkBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            checkBtn.disabled = false;
            answerEl.disabled = false;
            answerEl.readOnly = false;
          }

          function showNextMode() {
            answered = true;
            checkBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            checkBtn.disabled = true;
            nextBtn.disabled = false;
            answerEl.disabled = true;
            answerEl.readOnly = true;
          }

          function clearFeedback() {
            feedbackEl.className = 'hidden rounded-md border px-4 py-3 text-sm font-medium';
            feedbackEl.textContent = '';
          }

          function showProblem(problem) {
            state.problem = problem;
            showCheckMode();
            if (problem.display === 'long_division' && problem.layout) {
              promptEl.className = '';
              promptEl.innerHTML = renderLongDivision(problem.layout);
            } else if (problem.display === 'standard_algorithm' && problem.layout) {
              promptEl.className = '';
              promptEl.innerHTML = renderStandardAlgorithm(problem.layout);
            } else {
              promptEl.className =
                'font-display whitespace-pre-line text-2xl font-semibold leading-snug sm:text-3xl';
              promptEl.textContent = problem.prompt;
            }
            answerEl.value = '';
            clearFeedback();
            metaLine.textContent =
              'Grade ' +
              problem.grade +
              ' · ' +
              difficultyLabel(problem.difficulty || selectedDifficulty) +
              (problem.type ? ' · ' + typeLabel(mode, problem.type) : '');
            if (problem.hint) {
              hintEl.textContent = problem.hint;
              hintEl.classList.remove('hidden');
            } else {
              hintEl.textContent = '';
              hintEl.classList.add('hidden');
            }
            applyAnswerHints(problem.type || selectedType);
            answerEl.focus();
          }

          function loadProblem() {
            setBusy(true);
            statusEl.textContent = 'Loading problem…';
            clearFeedback();
            showCheckMode();
            checkBtn.disabled = true;
            promptEl.className = 'font-display text-2xl font-semibold leading-snug sm:text-3xl';
            promptEl.innerHTML =
              '<div class="skeleton h-8 w-4/5 rounded-md"></div><div class="skeleton mt-3 h-8 w-3/5 rounded-md"></div>';

            google.script.run
              .withSuccessHandler(function (problem) {
                showProblem(problem);
                setBusy(false);
                statusEl.textContent = '';
              })
              .withFailureHandler(function (error) {
                setBusy(false);
                if (handleAuthFailure(error)) return;
                promptEl.textContent = 'Could not load a problem.';
                statusEl.textContent = error && error.message ? error.message : String(error);
              })
              .getNextProblem(
                withToken({
                  mode: mode,
                  grade: Number(selectedGrade),
                  difficulty: selectedDifficulty,
                  type: typePills ? selectedType : null,
                  excludeId: state.problem ? state.problem.id : null,
                }),
              );
          }

          function checkAnswer() {
            if (!state.problem || answered) return;
            if (!String(answerEl.value).trim()) {
              statusEl.textContent = 'Enter an answer first.';
              answerEl.focus();
              return;
            }
            setBusy(true);
            statusEl.textContent = 'Checking…';
            google.script.run
              .withSuccessHandler(function (result) {
                statusEl.textContent = '';
                feedbackEl.classList.remove('hidden');
                if (result.correct) {
                  feedbackEl.className =
                    'rounded-md border border-success/30 bg-success/10 px-4 py-3 text-sm font-medium text-success';
                  feedbackEl.textContent = 'Correct — nice work. Ready for the next one?';
                } else {
                  feedbackEl.className =
                    'rounded-md border border-destructive/30 bg-destructive/10 px-4 py-3 text-sm font-medium text-destructive';
                  feedbackEl.textContent = 'Not quite. The correct answer is ' + result.correctAnswer + '.';
                }
                showNextMode();
                nextBtn.focus();
              })
              .withFailureHandler(function (error) {
                setBusy(false);
                if (handleAuthFailure(error)) return;
                statusEl.textContent = error && error.message ? error.message : String(error);
              })
              .checkAnswer(
                withToken({
                  mode: state.problem.mode,
                  id: state.problem.id,
                  grade: state.problem.grade,
                  userAnswer: answerEl.value,
                  answerKind: state.problem.answerKind || null,
                }),
              );
          }

          function boot(meta) {
            state.meta = meta;
            selectedGrade = Number((meta.grades && meta.grades[0]) || 3);
            selectedDifficulty = 'medium';
            typeOptions = meta.types || [];
            if (mode === 'multiplication') typeOptions = meta.multiplicationTypes || [];
            if (mode === 'division') typeOptions = meta.divisionTypes || [];
            if (mode === 'place_value') typeOptions = meta.placeValueTypes || [];
            if (mode === 'rounding') typeOptions = meta.roundingTypes || [];
            if (mode === 'factors') typeOptions = meta.factorsTypes || [];
            if (mode === 'times_as_many') typeOptions = meta.timesAsManyTypes || [];
            if (mode === 'money_count') typeOptions = meta.moneyCountTypes || [];
            if (mode === 'measurement') typeOptions = meta.measurementTypes || [];
            if (mode === 'time') typeOptions = meta.timeTypes || [];
            if (mode === 'fractions') typeOptions = meta.fractionTypes || [];
            if (mode === 'input_output') typeOptions = meta.inputOutputTypes || [];
            if (mode === 'geography') typeOptions = meta.geographyTypes || [];
            selectedType = typePills && typeOptions.length ? typeOptions[0].id : null;
            applyAnswerHints(selectedType);
            refreshPills();
            applyOptionsOpen();
            if (optionsToggle) {
              optionsToggle.addEventListener('click', function () {
                optionsOpen = !optionsOpen;
                applyOptionsOpen();
              });
            }
            checkBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', loadProblem);
            answerEl.addEventListener('keydown', function (e) {
              if (e.key === 'Enter') {
                if (answered) loadProblem();
                else checkAnswer();
              }
            });
            loadProblem();
          }

          if (state.meta) {
            boot(state.meta);
          } else {
            statusEl.textContent = 'Starting…';
            google.script.run
              .withSuccessHandler(boot)
              .withFailureHandler(function (error) {
                if (handleAuthFailure(error)) return;
                promptEl.textContent = 'Could not start activity.';
                statusEl.textContent = error && error.message ? error.message : String(error);
              })
              .getMeta(withToken());
          }
        }

        function submitLogin(event) {
          if (event) event.preventDefault();
          var username = els.loginUsername ? els.loginUsername.value : '';
          var password = els.loginPassword ? els.loginPassword.value : '';
          if (els.loginError) {
            els.loginError.textContent = '';
            els.loginError.classList.add('hidden');
          }
          if (els.loginSubmit) els.loginSubmit.disabled = true;
          google.script.run
            .withSuccessHandler(function (result) {
              if (els.loginSubmit) els.loginSubmit.disabled = false;
              state.token = result.token;
              state.user = {
                username: result.username,
                displayName: result.displayName,
              };
              writeStoredToken(result.token);
              startApp();
            })
            .withFailureHandler(function (error) {
              if (els.loginSubmit) els.loginSubmit.disabled = false;
              if (els.loginError) {
                els.loginError.textContent =
                  error && error.message ? error.message : 'Could not sign in.';
                els.loginError.classList.remove('hidden');
              }
              if (els.loginPassword) {
                els.loginPassword.value = '';
                els.loginPassword.focus();
              }
            })
            .login({ username: username, password: password });
        }

        function signOut() {
          var token = state.token;
          google.script.run
            .withSuccessHandler(function () {
              showLogin();
            })
            .withFailureHandler(function () {
              showLogin();
            })
            .logout({ token: token });
        }

        function bootAuth() {
          applyTheme(readStoredTheme());
          var token = readStoredToken();
          if (!token) {
            showLogin();
            return;
          }
          state.token = token;
          google.script.run
            .withSuccessHandler(function (session) {
              if (!session || !session.authenticated) {
                showLogin();
                return;
              }
              state.user = {
                username: session.username,
                displayName: session.displayName,
              };
              startApp();
            })
            .withFailureHandler(function () {
              showLogin();
            })
            .getSession({ token: token });
        }

        els.menuBtn.addEventListener('click', toggleSidebar);
        if (els.collapseBtn) els.collapseBtn.addEventListener('click', function () {
          setSidebarOpen(false);
        });
        if (els.themeToggle) els.themeToggle.addEventListener('click', cycleTheme);
        if (els.logoutBtn) els.logoutBtn.addEventListener('click', signOut);
        if (els.loginForm) els.loginForm.addEventListener('submit', submitLogin);
        els.overlay.addEventListener('click', closeMobileNav);
        window.addEventListener('resize', applySidebarState);
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          if (state.theme === 'system') applyTheme('system');
        });

        bootAuth();
      })();
    </script>
  </body>
</html>
