<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playground</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Playground" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1F6B56" />
    <meta name="application-name" content="Playground" />
    <!-- Absolute same-origin icons — required for iOS Add to Home Screen -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://arpit-patel1.github.io/apps-script-starter/apple-touch-icon.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://arpit-patel1.github.io/apps-script-starter/apple-touch-icon.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      href="https://arpit-patel1.github.io/apps-script-starter/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://arpit-patel1.github.io/apps-script-starter/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="https://arpit-patel1.github.io/apps-script-starter/icon-192.png"
    />
    <link
      rel="manifest"
      href="https://arpit-patel1.github.io/apps-script-starter/manifest.webmanifest"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: #0f1c18;
        color: #f7f3ea;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .splash {
        width: min(100%, 22rem);
        text-align: center;
      }
      .mark {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        display: block;
        margin: 0 auto 1.25rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.6rem 0 0;
        color: rgba(247, 243, 234, 0.72);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .actions {
        margin-top: 1.5rem;
        display: grid;
        gap: 0.75rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0 1.25rem;
        border-radius: 999px;
        background: #1f6b56;
        color: #f7f3ea;
        text-decoration: none;
        font-weight: 600;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: rgba(247, 243, 234, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <img
        class="mark"
        src="https://arpit-patel1.github.io/apps-script-starter/apple-touch-icon.png"
        width="180"
        height="180"
        alt="Playground"
      />
      <h1>Playground</h1>
      <p>Kids Homework Playground</p>
      <div class="actions">
        <a
          class="button"
          id="open"
          href="https://script.google.com/macros/s/AKfycbwpwvR7kEorpjdCRVXNq4wMu1ACk_kVgLu6wVdeJS6z16_d6JHWeZyZ1uhd8B3-RjHH/exec"
          >Open Playground</a
        >
      </div>
      <p class="hint">
        On iPhone: open this page in Safari, then Share → Add to Home Screen. Delete any old gray
        shortcut first.
      </p>
    </main>
    <script>
      (function () {
        var APP =
          'https://script.google.com/macros/s/AKfycbwpwvR7kEorpjdCRVXNq4wMu1ACk_kVgLu6wVdeJS6z16_d6JHWeZyZ1uhd8B3-RjHH/exec';
        var standalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
        // When launched from the home-screen icon, go straight into the app.
        if (standalone) {
          window.location.replace(APP);
        }
      })();
    </script>
  </body>
</html>
